title: 폰트 EULA 조항 조사
description: 폰트의 메트릭을 재는 것을 금지하는 조항이 실제로 있는가 — 약관·폰트 파일·공문서 원문 조사
lang: ko-KR
repository: msjang/krigf26-font-eula-survey

# 테마 젬을 쓰지 않는다. _layouts/default.html 이 전부를 담는다.
# 레포에는 마크다운만 두고, HTML 은 GitHub Pages 가 빌드한다.

defaults:
  - scope: { path: "" }
    values: { layout: default }

# 모든 페이지 아래에 붙는 고지. 문구는 여기서 고친다.
disclaimer:
  - 본 문서는 발표자 개인의 조사 결과이며 소속 기관의 공식 입장이 아닙니다.
    법률 의견이 아닙니다. 변호사 검토를 대체하지 않습니다.
  - 이 저장소의 문서는 Claude Opus 5(Anthropic)를 사용하여 작성했습니다.
    검수를 하였지만 실수가 있을 수 있습니다. 수정이 필요한 경우 레포의
    <a href="https://github.com/msjang/krigf26-font-eula-survey/issues">Issue</a>에 남겨주세요.
  - 수집·측정에 쓴 도구는
    <a href="https://github.com/msjang/krigf26-font-eula-survey/tree/master/tools">tools/</a>에,
    원자료는
    <a href="https://github.com/msjang/krigf26-font-eula-survey/tree/master/data">data/</a>에
    두어 누구나 재현할 수 있게 했습니다.

nav:
  - { name: 개요,        url: / }
  - { name: 리포트,      url: /report.html }
  - { name: 조항 매트릭스, url: /clause-matrix.html }
  - { name: 상위 20종,   url: /font-top20.html }
  - { name: 폰트 목록,    url: /font-registry.html }
  - { name: 내장 라이선스, url: /findings-licenses.html }
  - { name: 연도·부처 추세, url: /findings-trend.html }
  - { name: 대체 폰트,    url: /findings-substfont.html }
  - { name: 메트릭 실측,  url: /findings-metrics.html }
  - { name: 개방성 점검,  url: /findings-openness.html }
  - { name: HFT,        url: /findings-hft.html }
  - { name: Windows,    url: /findings-windows.html }
  - { name: 법령,        url: /findings-regulation.html }
  - { name: 공문서 실태,  url: /findings-gov-docs.html }
  - { name: 출처,        url: /sources.html }
  - { name: 남은 질문,    url: /open-questions.html }

# .md 링크를 .html 로 바꿔 주는 설정은 없으므로 문서 안에서는 상대 .md 링크를 쓴다.
# GitHub 웹에서 읽을 때는 그대로 동작하고, Pages 에서는 아래 redirect 로 넘어간다.
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

exclude:
  - PROCESS.md
  - tools/
  - data/
  - sources/
  - BRIEF.md
  - LICENSE
